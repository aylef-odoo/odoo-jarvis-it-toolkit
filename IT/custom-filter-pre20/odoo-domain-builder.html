<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Odoo domain builder</title>
<style>
  :root{
    --bg:#1b1a22;
    --panel:#242330;
    --panel-2:#2b2a38;
    --line:#3a3947;
    --line-soft:#312f3d;
    --text:#eae8f2;
    --text-dim:#9491a8;
    --text-faint:#6b687d;
    --accent:#8b7ff0;
    --accent-dim:#5d54a3;
    --and:#5dcaa5;
    --and-bg:#173e33;
    --or:#e0a03c;
    --or-bg:#40320f;
    --danger:#e2696b;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    padding:32px 20px 60px;
  }
  .wrap{max-width:760px;margin:0 auto;}
  header{margin-bottom:24px;}
  header h1{
    font-size:19px;
    font-weight:600;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  header p{
    margin:0;
    color:var(--text-dim);
    font-size:13px;
    line-height:1.5;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px;
  }
  .group{
    border-left:2px solid var(--line);
    padding-left:14px;
    margin-top:10px;
  }
  .group.root{border-left:none;padding-left:0;margin-top:0;}
  .group-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
  }
  .op-toggle{
    display:inline-flex;
    border:1px solid var(--line);
    border-radius:7px;
    overflow:hidden;
  }
  .op-toggle button{
    border:none;
    background:var(--panel-2);
    color:var(--text-dim);
    font-family:var(--mono);
    font-size:11px;
    font-weight:600;
    letter-spacing:0.03em;
    padding:5px 11px;
    cursor:pointer;
  }
  .op-toggle button.active[data-op="and"]{background:var(--and-bg);color:var(--and);}
  .op-toggle button.active[data-op="or"]{background:var(--or-bg);color:var(--or);}
  .group-label{font-size:11px;color:var(--text-faint);}
  .row{
    display:flex;
    align-items:center;
    gap:6px;
    margin-bottom:6px;
  }
  select, input[type=text]{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:6px;
    padding:6px 8px;
    font-size:13px;
    font-family:var(--sans);
  }
  select:focus, input[type=text]:focus{
    outline:none;
    border-color:var(--accent-dim);
  }
  .field-input{width:150px;}
  .op-select{width:120px;}
  .value-input{flex:1;min-width:80px;}
  .icon-btn{
    background:none;
    border:none;
    color:var(--text-faint);
    cursor:pointer;
    font-size:15px;
    line-height:1;
    padding:5px 7px;
    border-radius:5px;
  }
  .icon-btn:hover{background:var(--line-soft);color:var(--text);}
  .icon-btn.remove:hover{color:var(--danger);}
  .add-row{
    display:flex;
    gap:8px;
    margin-top:6px;
  }
  .add-btn{
    background:var(--panel-2);
    border:1px dashed var(--line);
    color:var(--text-dim);
    font-size:12px;
    padding:6px 10px;
    border-radius:6px;
    cursor:pointer;
  }
  .add-btn:hover{border-color:var(--accent-dim);color:var(--accent);}
  .out{
    margin-top:20px;
  }
  .out-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
  }
  .out-head h2{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--text-faint);
    margin:0;
    font-weight:600;
  }
  .copy-btn{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text-dim);
    font-size:12px;
    padding:5px 10px;
    border-radius:6px;
    cursor:pointer;
  }
  .copy-btn:hover{color:var(--text);border-color:var(--line-soft);}
  .copy-btn.copied{color:var(--and);border-color:var(--and-bg);}
  pre{
    background:#141319;
    border:1px solid var(--line);
    border-radius:8px;
    padding:14px 16px;
    font-family:var(--mono);
    font-size:12.5px;
    line-height:1.6;
    overflow-x:auto;
    color:#d3d0e0;
    margin:0;
    white-space:pre;
  }
  .tok-op{color:var(--accent);}
  .tok-field{color:#84c9ea;}
  .tok-cmp{color:var(--or);}
  .tok-val{color:var(--and);}
  .tok-punct{color:var(--text-faint);}
  .empty-msg{
    color:var(--text-faint);
    font-size:12.5px;
    font-style:italic;
    padding:4px 0;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Odoo domain builder</h1>
    <p>Add conditions, group them with AND / OR, and get a ready-to-paste Odoo domain — prefix operators handled for you.</p>
  </header>

  <div class="card">
    <div id="tree"></div>
  </div>

  <div class="out">
    <div class="out-head">
      <h2>Domain</h2>
      <button class="copy-btn" id="copyBtn">Copy</button>
    </div>
    <pre id="output"></pre>
  </div>
</div>

<script>
const OPERATORS = ["=", "!=", ">", "<", ">=", "<=", "like", "ilike", "not like", "not ilike", "in", "not in", "child_of", "=?"];

let idCounter = 0;
function newId(){ return "n" + (idCounter++); }

function newCondition(){
  return { id:newId(), kind:"cond", field:"", op:"ilike", value:"" };
}
function newGroup(op){
  return { id:newId(), kind:"group", op:op || "and", children:[newCondition()] };
}

let tree = newGroup("and");

function findGroup(node, id){
  if(node.id === id && node.kind === "group") return node;
  if(node.kind === "group"){
    for(const c of node.children){
      const found = findGroup(c, id);
      if(found) return found;
    }
  }
  return null;
}
function removeNode(node, id){
  if(node.kind !== "group") return false;
  const idx = node.children.findIndex(c => c.id === id);
  if(idx !== -1){ node.children.splice(idx,1); return true; }
  for(const c of node.children){
    if(removeNode(c, id)) return true;
  }
  return false;
}

function render(){
  const container = document.getElementById("tree");
  container.innerHTML = "";
  container.appendChild(renderGroup(tree, true));
  renderOutput();
}

function renderGroup(group, isRoot){
  const wrap = document.createElement("div");
  wrap.className = "group" + (isRoot ? " root" : "");

  const head = document.createElement("div");
  head.className = "group-head";

  const toggle = document.createElement("div");
  toggle.className = "op-toggle";
  ["and","or"].forEach(op => {
    const b = document.createElement("button");
    b.textContent = op.toUpperCase();
    b.setAttribute("data-op", op);
    if(group.op === op) b.classList.add("active");
    b.onclick = () => { group.op = op; render(); };
    toggle.appendChild(b);
  });
  head.appendChild(toggle);

  if(!isRoot){
    const label = document.createElement("span");
    label.className = "group-label";
    label.textContent = "group";
    head.appendChild(label);

    const spacer = document.createElement("div");
    spacer.style.flex = "1";
    head.appendChild(spacer);

    const removeBtn = document.createElement("button");
    removeBtn.className = "icon-btn remove";
    removeBtn.textContent = "✕";
    removeBtn.title = "Remove group";
    removeBtn.onclick = () => { removeNode(tree, group.id); render(); };
    head.appendChild(removeBtn);
  }

  wrap.appendChild(head);

  if(group.children.length === 0){
    const empty = document.createElement("div");
    empty.className = "empty-msg";
    empty.textContent = "No conditions in this group yet.";
    wrap.appendChild(empty);
  }

  group.children.forEach(child => {
    if(child.kind === "cond"){
      wrap.appendChild(renderCondition(group, child));
    } else {
      wrap.appendChild(renderGroup(child, false));
    }
  });

  const addRow = document.createElement("div");
  addRow.className = "add-row";

  const addCond = document.createElement("button");
  addCond.className = "add-btn";
  addCond.textContent = "+ condition";
  addCond.onclick = () => { group.children.push(newCondition()); render(); };
  addRow.appendChild(addCond);

  const addGroup = document.createElement("button");
  addGroup.className = "add-btn";
  addGroup.textContent = "+ group";
  addGroup.onclick = () => { group.children.push(newGroup("and")); render(); };
  addRow.appendChild(addGroup);

  wrap.appendChild(addRow);

  return wrap;
}

function renderCondition(parentGroup, cond){
  const row = document.createElement("div");
  row.className = "row";

  const fieldInput = document.createElement("input");
  fieldInput.type = "text";
  fieldInput.className = "field-input";
  fieldInput.placeholder = "field, e.g. name";
  fieldInput.value = cond.field;
  fieldInput.oninput = e => { cond.field = e.target.value; renderOutput(); };
  row.appendChild(fieldInput);

  const opSelect = document.createElement("select");
  opSelect.className = "op-select";
  OPERATORS.forEach(op => {
    const o = document.createElement("option");
    o.value = op; o.textContent = op;
    if(op === cond.op) o.selected = true;
    opSelect.appendChild(o);
  });
  opSelect.onchange = e => { cond.op = e.target.value; renderOutput(); };
  row.appendChild(opSelect);

  const valueInput = document.createElement("input");
  valueInput.type = "text";
  valueInput.className = "value-input";
  const isListOp = cond.op === "in" || cond.op === "not in";
  valueInput.placeholder = isListOp ? "comma separated, e.g. 37760, 12" : "value";
  valueInput.value = cond.value;
  valueInput.oninput = e => { cond.value = e.target.value; renderOutput(); };
  row.appendChild(valueInput);

  const removeBtn = document.createElement("button");
  removeBtn.className = "icon-btn remove";
  removeBtn.textContent = "✕";
  removeBtn.title = "Remove condition";
  removeBtn.onclick = () => { removeNode(tree, cond.id); render(); };
  row.appendChild(removeBtn);

  return row;
}

function parseValue(cond){
  const raw = cond.value.trim();
  const isListOp = cond.op === "in" || cond.op === "not in";
  if(isListOp){
    const parts = raw.length ? raw.split(",").map(s => s.trim()).filter(s => s.length) : [];
    const items = parts.map(p => {
      if(!isNaN(p) && p !== "") return p;
      return JSON.stringify(p);
    });
    return "[" + items.join(", ") + "]";
  }
  if(raw === "") return "''";
  if(raw === "true" || raw === "false") return raw === "true" ? "True" : "False";
  if(!isNaN(raw)) return raw;
  return JSON.stringify(raw);
}

function buildDomain(node){
  if(node.kind === "cond"){
    if(!node.field.trim()) return null;
    return `('${node.field.trim()}', '${node.op}', ${parseValue(node)})`;
  }
  const parts = node.children.map(buildDomain).filter(p => p !== null);
  if(parts.length === 0) return null;
  if(parts.length === 1) return parts[0];
  const glue = node.op === "and" ? "'&', " : "'|', ";
  let result = "";
  for(let i = 0; i < parts.length - 1; i++){
    result += glue;
  }
  return result + parts.join(", ");
}

function highlight(str){
  return str
    .replace(/'&'/g, '<span class="tok-op">\'&\'</span>')
    .replace(/'\|'/g, '<span class="tok-op">\'|\'</span>')
    .replace(/\('([^']*)', '([^']*)', /g, (m, f, op) =>
      `(<span class="tok-punct">'</span><span class="tok-field">${f}</span><span class="tok-punct">'</span>, <span class="tok-punct">'</span><span class="tok-cmp">${op}</span><span class="tok-punct">'</span>, `);
}

function renderOutput(){
  const parts = tree.children.map(buildDomain).filter(p => p !== null);
  const out = document.getElementById("output");
  if(parts.length === 0){
    out.innerHTML = '<span class="empty-msg">[]</span>';
    return;
  }
  let inner;
  if(parts.length === 1){
    inner = parts[0];
  } else {
    const glue = tree.op === "and" ? "'&', " : "'|', ";
    let joined = "";
    for(let i = 0; i < parts.length - 1; i++) joined += glue;
    inner = joined + parts.join(", ");
  }
  out.innerHTML = "[" + highlight(inner) + "]";
}

document.getElementById("copyBtn").onclick = () => {
  const text = document.getElementById("output").innerText;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById("copyBtn");
    btn.textContent = "Copied";
    btn.classList.add("copied");
    setTimeout(() => { btn.textContent = "Copy"; btn.classList.remove("copied"); }, 1200);
  });
};

render();
</script>
</body>
</html>
